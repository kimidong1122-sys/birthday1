<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>동윤이 생일 축하해!</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  height: 100vh;
  overflow: hidden;
  background: radial-gradient(circle, #25204b, #090817);
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: sans-serif;
}
h1 {
  color: white;
  font-size: clamp(32px, 8vw, 70px);
  text-align: center;
  text-shadow: 0 0 15px #ff65db, 0 0 35px #ff65db;
  animation: glow 2s infinite alternate;
  z-index: 2;
  padding: 20px;
}
@keyframes glow {
  from { transform: scale(1); }
  to { transform: scale(1.08); }
}
canvas { position: fixed; inset: 0; pointer-events: none; }
</style>
</head>
<body>
<canvas id="fireworks"></canvas>
<h1>동윤아 생일축하해 🎉</h1>
<script>
const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d");
let w, h;
let particles = [];

function resize() {
  w = canvas.width = innerWidth;
  h = canvas.height = innerHeight;
}
resize();
addEventListener("resize", resize);

function explode(x, y) {
  const colors = ["#ff4d6d", "#ffd166", "#06d6a0", "#4cc9f0", "#c77dff", "#ffffff"];
  const color = colors[Math.floor(Math.random() * colors.length)];
  for (let i = 0; i < 90; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 5 + 1;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 100,
      color
    });
  }
}

function animate() {
  ctx.fillStyle = "rgba(9, 8, 23, 0.18)";
  ctx.fillRect(0, 0, w, h);

  if (Math.random() < 0.045) {
    explode(Math.random() * w, Math.random() * h * 0.7);
  }

  particles.forEach((p, i) => {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.035;
    p.vx *= 0.99;
    p.vy *= 0.99;
    p.life--;
    ctx.globalAlpha = Math.max(0, p.life / 100);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2);
    ctx.fill();
    if (p.life <= 0) particles.splice(i, 1);
  });

  ctx.globalAlpha = 1;
  requestAnimationFrame(animate);
}

animate();
setInterval(() => {
  explode(Math.random() * w, Math.random() * h * 0.65);
}, 1100);
</script>
</body>
</html>
